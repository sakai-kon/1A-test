<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>1A 合唱伝言板</title>
  <link rel="stylesheet" href="./styles.css?v=20261003-1545">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="brand">
        <p class="eyebrow">CLASS CHOIR BOARD</p>
        <h1 id="site-title">1A 合唱伝言板</h1>
        <div class="current-song"><span class="current-song-label">現在の曲</span><strong id="song-title">曲名未設定</strong></div>
      </div>
      <div class="header-actions">
        <span id="role-badge" class="role-badge hidden"></span>
        <button id="logout-button" class="text-button hidden">ログアウト</button>
      </div>
    </header>

    <section id="setup-warning" class="notice hidden"><p>サイトの設定を確認してください。</p></section>

    <section id="login-view" class="login-card">
      <h2>1A 合唱伝言板</h2>
      <form id="login-form" class="stack">
        <input id="password" type="password" autocomplete="current-password" placeholder="クラスパスワード" required>
        <button type="submit">ログイン</button>
        <p id="login-error" class="error" role="alert"></p>
        <button id="show-admin-login" class="text-button" type="button">管理者ログイン</button>
      </form>
    </section>

    <section id="admin-login-view" class="login-card hidden">
      <h2>管理者ログイン</h2>
      <form id="admin-login-form" class="stack">
        <input id="admin-email" type="email" autocomplete="username" placeholder="管理者メールアドレス" required>
        <input id="admin-password" type="password" autocomplete="current-password" placeholder="管理者パスワード" required>
        <button type="submit">ログイン</button>
        <p id="admin-login-error" class="error" role="alert"></p>
      </form>
      <button id="back-to-login" class="text-button" type="button">クラスログインに戻る</button>
    </section>

      <section id="song-section" class="content-section">
        <div class="section-heading-row">
          <div>
            <p class="section-kicker">SONG</p>
            <div class="section-heading-main">
              <span class="section-icon">🎵</span>
              <div>
                <h2>曲</h2>
                <p class="muted">クラスで共有している曲を聴けます</p>
              </div>
            </div>
          </div>
        </div>

        <section id="admin-song-upload" class="song-upload hidden">
          <div class="admin-inline-title">
            <span class="admin-pill">管理者</span>
            <strong>曲を追加</strong>
          </div>
          <input id="voice-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm">
          <audio id="recording-preview" class="hidden" controls></audio>
          <form id="voice-form" class="stack hidden">
            <input id="voice-author" maxlength="40" placeholder="名前（任意）">
            <input id="voice-title" maxlength="100" placeholder="曲名・タイトル">
            <button type="submit">曲を追加</button>
          </form>
          <p id="recording-status" class="muted"></p>
        </section>

        <div class="list-header">
          <h3>共有中の曲</h3>
          <span id="song-list-label" class="muted">0曲</span>
        </div>
        <div id="song-messages" class="messages"></div>
      </section>

      <section id="admin-panel" class="admin-panel hidden">
        <div class="admin-panel-head">
          <div>
            <span class="admin-pill">管理者</span>
            <h2>サイト設定</h2>
            <p class="muted">クラス全体に表示される情報を変更できます。</p>
          </div>
        </div>
        <form id="site-form" class="admin-settings-form">
          <label>サイト名<input id="site-input" maxlength="100" placeholder="サイト名"></label>
          <label>現在の曲名<input id="song-input" maxlength="200" placeholder="合唱曲名"></label>
          <button type="submit">設定を保存</button>
        </form>
      </section>
    </section>
  </main>
    <footer class="site-footer">
      <span>1A 合唱伝言板</span>
      <a href="./terms.html">利用規約・免責事項</a>
    </footer>


  <template id="message-template">
    <article class="message">
      <div class="message-head"><span class="message-type"></span><strong class="message-author"></strong><time class="message-time"></time></div>
      <h3 class="message-title"></h3>
      <p class="message-body"></p>
      <button class="load-audio audio-button" type="button">▶ 曲を再生</button>
      <audio class="message-audio hidden" controls preload="none"></audio><button class="delete-button hidden" type="button">🗑 削除</button>
      
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
  <script src="./config.js?v=20261003-1500"></script>
  <script src="./app.js?v=20261003-1500" defer></script>
</body>
</html>
