<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>1A 合唱伝言板</title>
  <link rel="stylesheet" href="./styles.css?v=20261003-1301">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <h1 id="site-title">1A 合唱伝言板</h1>
        <p id="song-title" class="song-title">曲名未設定</p>
      </div>
      <div class="header-actions"><span id="role-badge" class="role-badge hidden"></span><button id="logout-button" class="text-button hidden">ログアウト</button></div>
    </header>

    <section id="setup-warning" class="notice hidden"><p>サイトの設定を確認してください。</p></section>

    <section id="login-view" class="login-card">
      <h2>1A 合唱伝言板</h2>
      <form id="login-form" class="stack">
        <input id="password" type="password" autocomplete="current-password" placeholder="クラスパスワード" required>
        <button type="submit">入る</button>
        <p id="login-error" class="error" role="alert"></p><button id="show-admin-login" class="text-button" type="button">管理者ログイン</button>
      </form>
    </section>

    <section id="admin-login-view" class="login-card hidden"><h2>管理者ログイン</h2><form id="admin-login-form" class="stack"><input id="admin-email" type="email" autocomplete="username" placeholder="管理者メールアドレス" required><input id="admin-password" type="password" autocomplete="current-password" placeholder="管理者パスワード" required><button type="submit">管理者として入る</button><p id="admin-login-error" class="error" role="alert"></p></form><button id="back-to-login" class="text-button" type="button">クラスログインに戻る</button></section>

    <section id="app-view" class="hidden">
      <section class="quick-post card">
        <form id="message-form" class="stack">
          <input id="message-author" maxlength="40" placeholder="名前（任意）">
          <textarea id="message-body" maxlength="2000" rows="3" placeholder="伝言を書く…"></textarea>
          <button type="submit">伝言を投稿</button>
        </form>
      </section>

      <section class="card audio-post">
        <div class="section-heading">
          <div><h2>🎵 曲を送る</h2><p class="muted">曲ファイルを選択（10MBまで）</p></div>
        </div>
        <input id="voice-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.webm">
        <audio id="recording-preview" class="hidden" controls></audio>
        <form id="voice-form" class="stack hidden">
          <input id="voice-author" maxlength="40" placeholder="名前（任意）">
          <input id="voice-title" maxlength="100" placeholder="タイトル（任意）">
          <button type="submit">曲を送る</button>
        </form>
        <p id="recording-status" class="muted"></p>
      </section>

      <section class="card messages-card">
        <div class="section-heading">
          <h2>最新の伝言</h2>
          <button id="reload-button" class="text-button" type="button">更新</button>
        </div>
        <div id="messages" class="messages"></div>
      </section>

      <section id="admin-panel" class="card admin-panel hidden"><h2>管理者メニュー</h2><form id="site-form" class="stack"><input id="site-input" maxlength="100" placeholder="サイト名"><input id="song-input" maxlength="200" placeholder="合唱曲名"><button type="submit">名前・曲名を保存</button></form></section>
    </section>
  </main>
    <footer class="site-footer"><a href="./terms.html">利用規約・免責事項</a></footer>


  <template id="message-template">
    <article class="message">
      <div class="message-head"><strong class="message-author"></strong><time class="message-time"></time></div>
      <h3 class="message-title"></h3>
      <p class="message-body"></p>
      <button class="load-audio audio-button" type="button">▶ 音声を再生</button>
      <audio class="message-audio hidden" controls preload="none"></audio><button class="delete-button hidden" type="button">🗑 この伝言を削除</button>
      
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
  <script src="./config.js?v=20261003-1301"></script>
  <script src="./app.js?v=20261003-1301" defer></script>
</body>
</html>
