<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>1A 合唱練習サイト</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">CHOIR PRACTICE</p>
        <h1 id="site-title">1A 合唱練習サイト</h1>
        <p id="song-title" class="song-title">読み込み中…</p>
      </div>
      <button id="logout-button" class="ghost hidden">ログアウト</button>
    </header>

    <section id="setup-warning" class="card warning hidden">
      <h2>Supabaseが未設定です</h2>
      <p class="muted">public/config.js にSupabase URL・Publishable Key・ログイン用メールアドレスを設定してください。</p>
    </section>

    <section id="login-view" class="card">
      <h2>ログイン</h2>
      <p class="muted">クラス用パスワードを入力してください。</p>
      <form id="login-form" class="stack">
        <input id="password" type="password" autocomplete="current-password" placeholder="パスワード" required>
        <button type="submit">入る</button>
        <p id="login-error" class="error" role="alert"></p>
      </form>
    </section>

    <section id="app-view" class="hidden">
      <div class="grid">
        <section class="card">
          <h2>曲名</h2>
          <form id="song-form" class="inline-form">
            <input id="song-input" maxlength="200" placeholder="合唱曲名">
            <button type="submit">保存</button>
          </form>
        </section>

        <section class="card">
          <h2>文字の伝言</h2>
          <form id="message-form" class="stack">
            <input id="message-author" maxlength="40" placeholder="名前（任意）">
            <textarea id="message-body" maxlength="2000" rows="4" placeholder="練習について伝えたいこと"></textarea>
            <button type="submit">伝言を投稿</button>
          </form>
        </section>

        <section class="card">
          <h2>音声の伝言</h2>
          <p class="muted">最大60秒・1ファイル10MB。音声は非公開Storageに保存します。</p>
          <div class="recorder">
            <div class="timer" id="recording-time">00:00</div>
            <div class="record-buttons">
              <button id="record-start" type="button">● 録音開始</button>
              <button id="record-stop" type="button" disabled>■ 停止</button>
            </div>
            <audio id="recording-preview" class="hidden" controls></audio>
            <form id="voice-form" class="stack hidden">
              <input id="voice-author" maxlength="40" placeholder="名前（任意）">
              <input id="voice-title" maxlength="100" placeholder="音声伝言のタイトル">
              <button type="submit">音声を保存</button>
            </form>
            <p id="recording-status" class="muted"></p>
          </div>
        </section>
      </div>

      <section class="card">
        <div class="section-heading">
          <div>
            <h2>伝言一覧</h2>
            <p class="muted">新しいものから表示します。</p>
          </div>
          <button id="reload-button" class="ghost" type="button">更新</button>
        </div>
        <div id="messages" class="messages"></div>
      </section>
    </section>
  </main>

  <template id="message-template">
    <article class="message">
      <div class="message-head">
        <strong class="message-author"></strong>
        <time class="message-time"></time>
      </div>
      <h3 class="message-title"></h3>
      <p class="message-body"></p>
      <button class="load-audio ghost" type="button">▶ 音声を再生</button>
      <audio class="message-audio hidden" controls preload="none"></audio>
      <button class="delete-button ghost" type="button">削除</button>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/tus-js-client@4/dist/tus.min.js"></script>
  <script src="./config.js"></script>
  <script src="./app.js" defer></script>
</body>
</html>
